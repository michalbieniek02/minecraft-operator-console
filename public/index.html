<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121614">
  <meta name="robots" content="noindex,nofollow">
  <title>Minecraft — konsola operatora</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden aria-labelledby="login-title">
    <div class="login-content">
      <svg class="mark" width="38" height="38" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 12 7v13l-12 7-12-7V10Z" stroke="currentColor" stroke-width="1.5"/><path d="m4 10 12 7 12-7M16 17v13M10 6.5l12 7V20" stroke="currentColor" stroke-width="1.5"/></svg>
      <h1 id="login-title">Twój serwer.<br>Twoja konsola.</h1>
      <p class="login-description">Zaloguj się, żeby zarządzać serwerem Minecraft.</p>
      <form id="login-form">
        <label for="password">Hasło operatora</label>
        <div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button id="show-password" class="icon-button" type="button" aria-label="Pokaż hasło" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary login-submit" id="login-submit" type="submit">Otwórz konsolę <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </form>
      <p class="login-note">Prywatny panel operatora</p>
    </div>
    <div class="login-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>

  <main id="panel" class="panel" hidden>
    <header class="header">
      <div class="identity"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 12 7v13l-12 7-12-7V10Z" stroke="currentColor" stroke-width="1.5"/><path d="m4 10 12 7 12-7M16 17v13" stroke="currentColor" stroke-width="1.5"/></svg><h1>Minecraft<span>Konsola operatora</span></h1></div>
      <button id="logout" class="text-button" type="button">Wyloguj <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4H4v16h5m5-13 5 5-5 5M9 12h10" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </header>
    <section class="workspace" aria-labelledby="console-heading">
      <div class="control-bar">
        <div class="server-state"><span id="state-dot" class="state-dot"></span><span id="state" role="status">Sprawdzam serwer…</span></div>
        <div class="power-controls"><button id="start" type="button" class="primary" disabled><svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m6 3 10 7-10 7V3Z"/></svg>Start</button><button id="stop" type="button" class="secondary" disabled><svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1"/></svg>Stop</button></div>
      </div>
      <div class="console-frame">
        <div class="console-toolbar"><h2 id="console-heading">Konsola Java</h2><label class="follow"><input id="follow" type="checkbox" checked>Przewijaj do końca</label></div>
        <pre id="output" class="console-output" tabindex="0" aria-label="Logi serwera Minecraft">Łączenie z konsolą…</pre>
        <form id="command-form" class="command-form"><span class="prompt" aria-hidden="true">&gt;</span><label class="sr-only" for="command">Komenda Minecrafta</label><input id="command" name="command" type="text" placeholder="Wpisz komendę Minecrafta…" autocomplete="off" spellcheck="false" maxlength="300" disabled><button id="send" type="submit" class="send-button" aria-label="Wyślij komendę" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="1.8"/></svg></button></form>
      </div>
      <div class="console-footer"><span id="notice" role="status">Pobieranie logów…</span><span>Enter — wyślij <span class="desktop-only">· ↑ ↓ — historia</span></span></div>
    </section>
  </main>
  <div id="boot" class="boot" role="status">Łączenie z panelem…</div>
</body>
</html>
